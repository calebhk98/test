[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-wiki"
version = "0.1.0"
description = "A searchable markdown wiki built from YouTube videos, for AI agents"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.11.12", "numpy>=1.26"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
embed = ["sentence-transformers>=5.0"]
mcp = ["mcp>=1.2"]
all = ["faster-whisper>=1.1", "sentence-transformers>=5.0", "mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
agentwiki = "agentwiki.cli:main"

[tool.setuptools.packages.find]
include = ["agentwiki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
